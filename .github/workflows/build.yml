name: Compiler l'APK Mercure Share

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler l'APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer l'APK
        run: |
          mkdir -p sortie
          cp app/build/outputs/apk/release/*.apk sortie/MercureShare.apk
          ls -la sortie

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: MercureShare-APK
          path: sortie/MercureShare.apk
